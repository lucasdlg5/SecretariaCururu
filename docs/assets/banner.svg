<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="20" fill="url(#bg)" />
  <rect width="1200" height="280" rx="20" fill="url(#grid)" />

  <!-- Glowing Accent Top Bar -->
  <rect x="60" y="0" width="1080" height="4" rx="2" fill="url(#accent)" />

  <!-- Icon / Emblem -->
  <g transform="translate(80, 68)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="64" cy="54" r="24" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2.5" />
    <!-- Bot / Shield / Receipt Symbol -->
    <path d="M48 54 L60 66 L82 42" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="34" y="92" width="60" height="10" rx="5" fill="#38bdf8" fill-opacity="0.7" />
    <circle cx="38" cy="30" r="4" fill="#34d399" />
    <circle cx="90" cy="30" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Title -->
  <text x="240" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    SecretariaCururu
  </text>

  <!-- Tagline -->
  <text x="240" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Automação &amp; Conciliação Inteligente de Contas Domésticas • 100% Free Tier
  </text>

  <!-- Feature Pills -->
  <g transform="translate(240, 178)">
    <rect x="0" y="0" width="175" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <text x="87" y="21" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#6ee7b7">AES-256-GCM Vault</text>

    <rect x="190" y="0" width="185" height="32" rx="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" />
    <text x="282" y="21" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7dd3fc">Playwright Engine</text>

    <rect x="390" y="0" width="195" height="32" rx="16" fill="#311042" stroke="#c084fc" stroke-width="1.2" />
    <text x="487" y="21" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#e9d5ff">Gemini Vision OCR</text>

    <rect x="600" y="0" width="215" height="32" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
    <text x="707" y="21" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#e2e8f0">Telegram HITL + Drive</text>
  </g>
</svg>

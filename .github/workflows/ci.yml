name: Continuous Integration (Build, Typecheck & Vitest)

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-monorepo:
    name: Build, Typecheck & Unit Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build all packages & apps
        run: pnpm build

      - name: Run strict TypeScript typecheck
        run: pnpm typecheck

      - name: Run Vitest unit & integration test suite
        run: pnpm test
